version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: attendance-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: attendance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql

  pgadmin:
    image: dpage/pgadmin4
    container_name: attendance-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5555:80"
    depends_on:
      - db

  maildev:
    image: maildev/maildev
    container_name: attendance-maildev
    restart: always
    ports:
      - "1080:1080"
      - "1025:1025"

  backend:
    build: ./backend
    container_name: attendance-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_NAME=attendance
      - DB_PORT=5432
      - JWT_SECRET=supersecretjwtkey
      - SMTP_HOST=maildev
      - SMTP_PORT=1025
    depends_on:
      - db
      - maildev

  frontend:
    build: ./frontend
    container_name: attendance-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
